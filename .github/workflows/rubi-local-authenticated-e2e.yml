name: RUBI Local Authenticated E2E — Four Profiles

# Revalidate Sprint 307 together with the current main security regressions after branch synchronization.
# Validate Sprint 307 against the latest documentation and security baseline on main.

on:
  pull_request:
    paths:
      - "src/integrations/supabase/client.ts"
      - "src/routes/**"
      - "src/lib/**"
      - "scripts/rubi-local-auth-fixtures.mjs"
      - "scripts/rubi-local-authenticated.e2e.spec.mjs"
      - "scripts/rubi-local-distribution-campaign-concurrency.mjs"
      - "src/lib/rubi-distribution-campaign-uniqueness.test.mjs"
      - "scripts/rubi-local-story-fixture.mjs"
      - "scripts/rubi-local-smart-collection-grants-smoke.sql"
      - "scripts/rubi-local-analytics-privacy-smoke.sql"
      - "scripts/rubi-local-public-table-privilege-hardening-smoke.sql"
      - "scripts/rubi-local-strategy-orchestration-pause-audit-smoke.sql"
      - "scripts/rubi-local-opportunity-refresh-audit-smoke.sql"
      - "scripts/rubi-local-customer-coupon-audit-smoke.sql"
      - "scripts/rubi-local-product-media-audit-smoke.sql"
      - "scripts/rubi-local-support-faq-audit-smoke.sql"
      - "scripts/rubi-local-admin-user-ban-audit-smoke.sql"
      - "scripts/rubi-local-telegram-send-outbox-smoke.sql"
      - "scripts/rubi-local-admin-user-ban-concurrency.sh"
      - "scripts/rubi-local-manual-trending-audit-smoke.sql"
      - "scripts/rubi-local-manual-trending-concurrency.sh"
      - "scripts/rubi-local-strategy-orchestration-pause-concurrency.sh"
      - "scripts/rubi-local-partner-academy-progress-smoke.sql"
      - "scripts/rubi-local-story-offer.e2e.spec.mjs"
      - "rubi-local-playwright.config.mjs"
      - "supabase/migrations/**"
      - ".github/workflows/rubi-local-authenticated-e2e.yml"
      - ".github/workflows/sprint-33-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rubi-local-auth-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-local:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0
      - name: Install application and browser dependencies
        run: |
          npm ci
          npm install --no-save --package-lock=false --legacy-peer-deps @playwright/test @tanstack/react-query@5.102.8 @tanstack/query-core@5.102.8
          npx playwright install --with-deps chromium
      - name: Defer the founding-Master gate and later migrations until the disposable owner exists
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rubi-deferred-migrations"
          while IFS= read -r -d '' file; do
            name="$(basename "$file")"
            version="${name%%_*}"
            if [[ "$version" =~ ^[0-9]{14}$ ]] && [[ "$version" > "20261113089999" ]]; then
              mv "$file" "$RUNNER_TEMP/rubi-deferred-migrations/$name"
            fi
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0 | sort -z)
          test -f "$RUNNER_TEMP/rubi-deferred-migrations/20261113090000_rubi_primary_master_roles.sql"
      - name: Consolidate reviewed historical migration collisions for local bootstrap only
        run: node scripts/consolidate-local-migration-versions.mjs
      - name: Allocate a dedicated local database port for CI
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const path = "supabase/config.toml";
          let config = await readFile(path, "utf8");
          if (/^\[db\]\s*$/m.test(config)) {
            if (/^port\s*=.*$/m.test(config)) {
              config = config.replace(/^port\s*=.*$/m, "port = 55432");
            } else {
              config = config.replace(/^\[db\]\s*$/m, "[db]\nport = 55432");
            }
          } else {
            config += "\n[db]\nport = 55432\n";
          }
          await writeFile(path, config);
          console.log("Configured disposable CI database on 127.0.0.1:55432.");
          NODE
      - name: Start isolated local Supabase
        run: |
          supabase start -x studio,imgproxy,logflare,vector,edge-runtime,supavisor,mailpit > "$RUNNER_TEMP/rubi-supabase-start.log" 2>&1
          STATUS="$(supabase status -o env)"
          value() { printf '%s\n' "$STATUS" | sed -n "s/^$1=\"\(.*\)\"$/\1/p"; }
          echo "SUPABASE_URL=$(value API_URL)" >> "$GITHUB_ENV"
          echo "SUPABASE_PUBLISHABLE_KEY=$(value ANON_KEY)" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(value SERVICE_ROLE_KEY)" >> "$GITHUB_ENV"
          echo "SUPABASE_DB_URL=$(value DB_URL)" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_URL=$(value API_URL)" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$(value ANON_KEY)" >> "$GITHUB_ENV"
      - name: Apply schema migrations before seeding the disposable Master
        run: supabase migration up --local
      - name: Diagnose local Supabase startup failure
        if: failure()
        run: |
          echo "## Local Supabase startup diagnostics" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/rubi-supabase-start.log" ]; then
            sed -E 's/eyJ[A-Za-z0-9._-]{20,}/[REDACTED_JWT]/g; s/(service_role|anon)[=: ]+[A-Za-z0-9._-]{20,}/\\1=[REDACTED]/g' "$RUNNER_TEMP/rubi-supabase-start.log" | tail -n 240 | tee "$RUNNER_TEMP/rubi-supabase-start-sanitized.log" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '### Docker containers' >> "$GITHUB_STEP_SUMMARY"
          docker ps -a --no-trunc >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '### Docker daemon summary' >> "$GITHUB_STEP_SUMMARY"
          docker info --format 'Server={{.ServerVersion}} Storage={{.Driver}} Cgroup={{.CgroupVersion}}' >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
      - name: Upload sanitized Supabase diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rubi-local-supabase-diagnostics
          path: ${{ runner.temp }}/rubi-supabase-start-sanitized.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Seed one disposable founding Master before its migration
        run: node scripts/rubi-local-auth-fixtures.mjs bootstrap-owner
      - name: Restore deferred migrations and apply the real founding-Master invariant
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP/rubi-deferred-migrations" -maxdepth 1 -type f -name '*.sql' -exec mv -t supabase/migrations -- {} +
          node scripts/consolidate-local-migration-versions.mjs
          supabase migration up --local
      - name: Seed isolated consumer, approved merchant and approved partner identities
        run: node scripts/rubi-local-auth-fixtures.mjs seed-profiles
      - name: Install PostgreSQL client for isolated worker smoke
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Verify partner academy progress isolation and profile-specific lessons
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 \
            -v partner_id="$RUBI_QA_PARTNER_USER_ID" \
            -v consumer_id="$RUBI_QA_CONSUMER_USER_ID" \
            -f scripts/rubi-local-partner-academy-progress-smoke.sql
      - name: Verify smart collection client grants on disposable PostgreSQL
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f scripts/rubi-local-smart-collection-grants-smoke.sql

      - name: Verify analytics personal-read isolation and least-privilege grants
        run: >-
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1
          -v consumer_id="$RUBI_QA_CONSUMER_USER_ID"
          -v merchant_id="$RUBI_QA_MERCHANT_USER_ID"
          -f scripts/rubi-local-analytics-privacy-smoke.sql

      - name: Verify public table privilege hardening and future defaults
        run: psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f scripts/rubi-local-public-table-privilege-hardening-smoke.sql
      - name: Verify Sprint 308 audited Strategy Orchestration pause on disposable PostgreSQL
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 \
            -v master_id="$RUBI_QA_MASTER_USER_ID" \
            -v non_owner_id="$RUBI_QA_CONSUMER_USER_ID" \
            -f scripts/rubi-local-strategy-orchestration-pause-audit-smoke.sql
      - name: Verify concurrent Sprint 308 audited pauses serialize to one transition
        run: bash scripts/rubi-local-strategy-orchestration-pause-concurrency.sh
      - name: Prove administrative video audit atomicity and Owner isolation in disposable PostgreSQL
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          test -n "${RUBI_QA_MASTER_USER_ID:-}"
          test -n "${RUBI_QA_CONSUMER_USER_ID:-}"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 \
            -v master_id="$RUBI_QA_MASTER_USER_ID" \
            -v non_owner_id="$RUBI_QA_CONSUMER_USER_ID" \
            -f scripts/rubi-local-admin-audit-smoke.sql
      - name: Prove referral tier Owner authorization, atomic audit and rollback in disposable PostgreSQL
        run: >-
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1
          -v master_id="$RUBI_QA_MASTER_USER_ID"
          -v non_owner_id="$RUBI_QA_CONSUMER_USER_ID"
          -f scripts/rubi-local-referral-tier-audit-smoke.sql
      - name: Prove brand identity Owner authorization and atomic audit in disposable PostgreSQL
        run: >-
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1
          -v master_id="$RUBI_QA_MASTER_USER_ID"
          -v non_owner_id="$RUBI_QA_CONSUMER_USER_ID"
          -f scripts/rubi-local-brand-identity-audit-smoke.sql
      - name: Prove product gallery Owner authorization, atomic audit and rollback on disposable PostgreSQL
        run: >-
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1
          -v master_id="$RUBI_QA_MASTER_USER_ID"
          -v non_owner_id="$RUBI_QA_CONSUMER_USER_ID"
          -f scripts/rubi-local-product-media-audit-smoke.sql
      - name: Prove support FAQ Owner authorization, atomic audit and rollback on disposable PostgreSQL
        run: >-
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1
          -v master_id="$RUBI_QA_MASTER_USER_ID"
          -v non_owner_id="$RUBI_QA_CONSUMER_USER_ID"
          -f scripts/rubi-local-support-faq-audit-smoke.sql

      - name: Prove manual retention Owner authorization and atomic audit on disposable PostgreSQL
        run: >-
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1
          -v master_id="$RUBI_QA_MASTER_USER_ID"
          -v non_owner_id="$RUBI_QA_CONSUMER_USER_ID"
          -f scripts/rubi-local-manual-automation-audit-smoke.sql
      - name: Prove manual trending Owner authorization and atomic audit on disposable PostgreSQL
        run: >-
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1
          -v master_id="$RUBI_QA_MASTER_USER_ID"
          -v non_owner_id="$RUBI_QA_CONSUMER_USER_ID"
          -v merchant_id="$RUBI_QA_MERCHANT_USER_ID"
          -v partner_id="$RUBI_QA_PARTNER_USER_ID"
          -f scripts/rubi-local-manual-trending-audit-smoke.sql
      - name: Prove concurrent manual trending recalculations serialize
        run: bash scripts/rubi-local-manual-trending-concurrency.sh
      - name: Prove administrative user-ban Owner authorization and atomic audit on disposable PostgreSQL
        run: >-
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1
          -v master_id="$RUBI_QA_MASTER_USER_ID"
          -v non_owner_id="$RUBI_QA_CONSUMER_USER_ID"
          -v merchant_id="$RUBI_QA_MERCHANT_USER_ID"
          -v partner_id="$RUBI_QA_PARTNER_USER_ID"
          -f scripts/rubi-local-admin-user-ban-audit-smoke.sql
      - name: Prove concurrent administrative user-ban requests serialize to one audit event
        run: bash scripts/rubi-local-admin-user-ban-concurrency.sh
      - name: Prove customer coupon Owner authorization, atomic audit and rollback on disposable PostgreSQL
        run: >-
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1
          -v master_id="$RUBI_QA_MASTER_USER_ID"
          -v non_owner_id="$RUBI_QA_CONSUMER_USER_ID"
          -f scripts/rubi-local-customer-coupon-audit-smoke.sql
      - name: Prove Telegram config and Vault atomic audit on disposable PostgreSQL
        run: >-
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1
          -v master_id="$RUBI_QA_MASTER_USER_ID"
          -v non_owner_id="$RUBI_QA_CONSUMER_USER_ID"
          -f scripts/rubi-local-telegram-config-audit-smoke.sql
      - name: Prove RUBI Business quote admin audit and rollback on disposable PostgreSQL
        run: >-
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1
          -v master_id="$RUBI_QA_MASTER_USER_ID"
          -v non_owner_id="$RUBI_QA_CONSUMER_USER_ID"
          -v merchant_id="$RUBI_QA_MERCHANT_USER_ID"
          -f scripts/rubi-local-business-quote-admin-audit-smoke.sql
      - name: Prove Opportunity Engine status audit and rollback on disposable PostgreSQL
        run: >-
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1
          -v master_id="$RUBI_QA_MASTER_USER_ID"
          -v non_owner_id="$RUBI_QA_CONSUMER_USER_ID"
          -f scripts/rubi-local-opportunity-alert-audit-smoke.sql
      - name: Prove Opportunity Engine refresh audit rollback on disposable PostgreSQL
        run: >-
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1
          -v master_id="$RUBI_QA_MASTER_USER_ID"
          -v non_owner_id="$RUBI_QA_CONSUMER_USER_ID"
          -f scripts/rubi-local-opportunity-refresh-audit-smoke.sql
      - name: Prove concurrent administrative video transitions serialize in disposable PostgreSQL
        run: |
          set -euo pipefail
          bash scripts/rubi-local-admin-audit-concurrency.sh
      - name: Seed disposable supplier, product, reviewed movement and private Story
        run: node scripts/rubi-local-story-fixture.mjs
      - name: Prove Telegram manual and test send outbox authorization, atomicity and idempotency
        run: >-
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1
          -v master_id="$RUBI_QA_MASTER_USER_ID"
          -v non_owner_id="$RUBI_QA_CONSUMER_USER_ID"
          -v merchant_id="$RUBI_QA_MERCHANT_USER_ID"
          -v partner_id="$RUBI_QA_PARTNER_USER_ID"
          -v product_id="$RUBI_QA_APPROVED_STORY_PRODUCT_ID"
          -f scripts/rubi-local-telegram-send-outbox-smoke.sql
      - name: Prove product/channel/campaign uniqueness under concurrent PostgreSQL transactions
        run: node scripts/rubi-local-distribution-campaign-concurrency.mjs
      - name: Exercise privileged notification worker against hostile temp relation
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_URL:-}"
          test -n "${RUBI_QA_APPROVED_STORY_PRODUCT_ID:-}"
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -v product_id="$RUBI_QA_APPROVED_STORY_PRODUCT_ID" -f scripts/rubi-local-content-notification-worker-smoke.sql
      - name: Point the generated browser client to the local Supabase instance
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const path = "src/integrations/supabase/client.ts";
          let source = await readFile(path, "utf8");
          source = source.replace(
            /const SUPABASE_URL = "[^"]+";/,
            'const SUPABASE_URL = import.meta.env.VITE_SUPABASE_URL ?? "";'
          );
          source = source.replace(
            /const SUPABASE_PUBLISHABLE_KEY = "[^"]+";/,
            'const SUPABASE_PUBLISHABLE_KEY = import.meta.env.VITE_SUPABASE_PUBLISHABLE_KEY ?? "";'
          );
          if (!source.includes("import.meta.env.VITE_SUPABASE_URL") || !source.includes("import.meta.env.VITE_SUPABASE_PUBLISHABLE_KEY")) {
            throw new Error("Could not safely redirect the browser Supabase client to local QA.");
          }
          await writeFile(path, source);
          NODE
      - name: Start the app against local Supabase
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/rubi-vite.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:4173/auth > /dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/rubi-vite.log"
          exit 1
      - name: Run authenticated profiles and persisted Story-to-offer journeys on mobile and desktop
        env:
          RUBI_E2E_REPORT_PATH: ${{ runner.temp }}/rubi-local-auth-evidence.json
        run: npx playwright test --config=rubi-local-playwright.config.mjs
      - name: Enforce complete authenticated E2E report
        if: success()
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          const path = process.env.RUNNER_TEMP + "/rubi-local-auth-evidence.json";
          const report = JSON.parse(await readFile(path, "utf8"));
          const stats = report.stats || {};
          const requiredStats = ["expected", "unexpected", "skipped", "flaky"];
          for (const key of requiredStats) {
            if (!Number.isInteger(stats[key])) throw new Error(`Playwright report is missing integer stats.${key}`);
          }
          if (stats.expected < 22 || stats.unexpected !== 0 || stats.skipped !== 0 || stats.flaky !== 0) {
            throw new Error(`Authenticated E2E report rejected: expected=${stats.expected}, unexpected=${stats.unexpected}, skipped=${stats.skipped}, flaky=${stats.flaky}. Require all 22 baseline tests and zero failures/skips/flakes.`);
          }

          const tests = [];
          const visit = (suite, parents = []) => {
            const titles = [...parents, suite.title].filter(Boolean);
            for (const spec of suite.specs || []) {
              for (const test of spec.tests || []) {
                tests.push({
                  title: [...titles, spec.title || "untitled"].join(" / "),
                  results: test.results || []
                });
              }
            }
            for (const child of suite.suites || []) visit(child, titles);
          };
          for (const suite of report.suites || []) visit(suite);

          if (tests.length < 22) {
            throw new Error(`Authenticated E2E report contains only ${tests.length} test records; require at least 22.`);
          }
          const incomplete = tests.filter(test => !test.results.length || test.results.at(-1)?.status !== "passed");
          if (incomplete.length) {
            throw new Error("Authenticated E2E report contains tests without a final passed result: " + incomplete.map(test => test.title).join("; "));
          }

          const requiredScenarios = [
            "CONSUMER authenticates and reaches its protected journey",
            "MERCHANT authenticates and reaches its protected journey",
            "PARTNER authenticates and reaches its protected journey",
            "MASTER authenticates and reaches its protected journey",
            "authenticated non-owner cannot enter the Master dashboard",
            "Master não publica Story quando produto não possui checkout oficial verificado",
            "Master não publica Story sem confirmação de direitos mesmo com produto e checkout elegíveis",
            "Master aprova o Story persistido e consumidor encontra a mesma oferta sem sair para pagamento",
            "Consumidor não recebe Story cuja revisão do movimento ficou obsoleta",
            "Master não publica Story com produto inativo",
            "Master não publica Story com fornecedor inativo"
          ];
          for (const scenario of requiredScenarios) {
            const matches = tests.filter(test => test.title.includes(scenario));
            if (matches.length < 2) {
              throw new Error(`Required mobile/desktop E2E scenario is missing or incomplete: ${scenario} (found ${matches.length}, expected at least 2).`);
            }
          }
          console.log(`Authenticated E2E report accepted: ${tests.length} test records, all final results passed, all 11 required scenarios present on mobile and desktop, zero unexpected/skipped/flaky.`);
          NODE
      - name: Publish non-secret test evidence
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/rubi-local-auth-evidence.json" ]; then
            node -e 'const r=require(process.argv[1]); const s=(r.suites||[]).flatMap(x=>x.specs||[]); console.log("## RUBI authenticated local E2E"); console.log("Specs: "+s.length); console.log("Tests: "+(r.stats?.expected??0)+" expected, "+(r.stats?.unexpected??0)+" failed.");' "$RUNNER_TEMP/rubi-local-auth-evidence.json" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build sanitized downloadable E2E evidence
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const source = process.env.RUNNER_TEMP + "/rubi-local-auth-evidence.json";
          const destination = process.env.RUNNER_TEMP + "/rubi-local-evidence-sanitized.json";
          try {
            const report = JSON.parse(await readFile(source, "utf8"));
            const suites = [];
            const visit = (suite, parents = []) => {
              const titles = [...parents, suite.title].filter(Boolean);
              for (const spec of suite.specs || []) {
                suites.push({
                  suite: titles.join(" / "),
                  spec: spec.title || "untitled",
                  tests: (spec.tests || []).map(test => ({
                    project: test.projectName || null,
                    status: test.status || null,
                    outcomes: (test.results || []).map(result => ({
                      status: result.status || null,
                      duration_ms: Number.isFinite(result.duration) ? result.duration : null
                    }))
                  }))
                });
              }
              for (const child of suite.suites || []) visit(child, titles);
            };
            for (const suite of report.suites || []) visit(suite);
            const safe = {
              generated_at: new Date().toISOString(),
              stats: {
                expected: report.stats?.expected ?? null,
                unexpected: report.stats?.unexpected ?? null,
                skipped: report.stats?.skipped ?? null,
                flaky: report.stats?.flaky ?? null
              },
              suites
            };
            await writeFile(destination, JSON.stringify(safe, null, 2) + "\n", { mode: 0o600 });
            JSON.parse(await readFile(destination, "utf8"));
            console.log("Sanitized E2E summary generated; raw report and runtime details excluded.");
          } catch (error) {
            console.log("No complete Playwright report available for evidence export.");
            if (error?.code !== "ENOENT") throw error;
          }
          NODE
      - name: Upload sanitized E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubi-local-e2e-sanitized-evidence
          path: ${{ runner.temp }}/rubi-local-evidence-sanitized.json
          if-no-files-found: warn
          retention-days: 7
      - name: Stop and discard local Supabase
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup || true
          fi
