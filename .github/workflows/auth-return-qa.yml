name: Auth return flow QA

on:
  push:
    branches:
      - fix/auth-return-flow-2026-11-01
  pull_request:
    paths:
      - 'src/routes/auth.tsx'
      - 'src/routes/register.tsx'
      - 'src/routes/onboarding.tsx'
      - 'src/routes/wholesale.tsx'
      - '.github/workflows/auth-return-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate TanStack routes and verify initial build
        run: npm run build
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
