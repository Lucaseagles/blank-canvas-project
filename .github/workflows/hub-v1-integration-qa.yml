name: Hub V1 integration QA

on:
  push:
    branches:
      - feat/partner-product-authorizations-v1
      - feat/commercial-approvals-v1
      - feat/admin-hub-b2b-tiers-2026-11-03
      - feat/admin-hub-suppliers-2026-11-03
      - feat/admin-hub-product-edit-2026-11-03
      - feat/wholesale-catalog-ux-2026-11-03
  pull_request:
    paths:
      - 'src/lib/**'
      - 'src/routes/admin/**'
      - 'src/routes/wholesale.tsx'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'src/components/store/**'
      - 'src/routes/hub-product.$productId.tsx'
      - 'src/hooks/useWebPush.ts'
      - 'src/routes/hub-product.$productId.tsx'
      - 'scripts/rubi-local-distribution-campaign-concurrency.mjs'
      - 'src/lib/rubi-distribution-campaign-uniqueness.test.mjs'
      - 'scripts/rubi-local-analytics-privacy-smoke.sql'
      - 'src/routes/r/**'
      - '.github/workflows/hub-v1-integration-qa.yml'
      - '.github/workflows/sprint-33-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-v1-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, build, TypeScript and lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Diagnose locked dependency advisories (non-blocking)
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" 2> "$RUNNER_TEMP/npm-audit.stderr" || true
          node --input-type=module <<'NODE'
          import { readFile, appendFile } from "node:fs/promises";
          const path = process.env.RUNNER_TEMP + "/npm-audit.json";
          let report;
          let parseError = null;
          try {
            report = JSON.parse(await readFile(path, "utf8"));
          } catch (error) {
            parseError = error;
          }
          const hasAuditMetadata = report && report.metadata && report.metadata.vulnerabilities;
          const lines = ["## Locked dependency audit", ""];
          if (parseError || report?.error || !hasAuditMetadata) {
            const reason = report?.error?.summary || report?.error?.code || parseError?.message || "npm audit returned no vulnerability metadata";
            lines.push("**Result unavailable — not interpreted as zero vulnerabilities.**", "", "Reason: " + String(reason).replaceAll("|", "/"), "", "The diagnostic is non-blocking; rerun npm audit when registry access is available.");
          } else {
            const entries = Object.entries(report.vulnerabilities || {});
            const summary = report.metadata.vulnerabilities;
            lines.push(
              "Findings: " + (summary.total ?? entries.length) + " total; " + (summary.critical ?? 0) + " critical; " + (summary.high ?? 0) + " high; " + (summary.moderate ?? 0) + " moderate; " + (summary.low ?? 0) + " low; " + (summary.info ?? 0) + " info.",
              "",
              "| Package | Severity | Direct | Affected range | Suggested fix | Advisory |",
              "|---|---:|:---:|---|---|---|"
            );
            for (const [name, item] of entries) {
              const advisories = (item.via || []).filter(value => typeof value === "object");
              const advisory = advisories.map(value => value.title || value.url || value.name).join("; ") || "Transitive dependency chain";
              const fix = item.fixAvailable === true ? "Compatible fix" : item.fixAvailable === false ? "No automatic fix" : item.fixAvailable && typeof item.fixAvailable === "object" ? (item.fixAvailable.name || name) + "@" + (item.fixAvailable.version || "version unspecified") + (item.fixAvailable.isSemVerMajor ? " (major; manual review)" : " (review)") : "Unknown";
              lines.push("| " + name + " | " + item.severity + " | " + (item.isDirect ? "Yes" : "No") + " | " + (item.range || "—") + " | " + fix.replaceAll("|", "/") + " | " + advisory.replaceAll("|", "/") + " |");
            }
            if (!entries.length) lines.push("| — | none | — | — | — | No vulnerable packages reported |");
            lines.push("", "This diagnostic is informational and does not modify package.json or package-lock.json.");
          }
          lines.push("");
          const output = lines.join("\n");
          console.log(output);
          await appendFile(process.env.GITHUB_STEP_SUMMARY, output + "\n");
          NODE
      - name: Generate routes and build
        run: npm run build
