name: Hub V1 integration QA

on:
  push:
    branches:
      - feat/partner-product-authorizations-v1
      - feat/commercial-approvals-v1
      - feat/admin-hub-b2b-tiers-2026-11-03
      - feat/admin-hub-suppliers-2026-11-03
      - feat/admin-hub-product-edit-2026-11-03
      - feat/wholesale-catalog-ux-2026-11-03
  pull_request:
    paths:
      - 'src/lib/**'
      - 'src/routes/admin/**'
      - 'src/routes/wholesale.tsx'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'src/components/store/**'
      - 'src/routes/hub-product.$productId.tsx'
      - 'src/hooks/useWebPush.ts'
      - 'src/routes/hub-product.$productId.tsx'
      - 'src/routes/r/**'
      - '.github/workflows/hub-v1-integration-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-v1-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, build, TypeScript and lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate routes and build
        run: npm run build
      - name: RUBI checkout validation security tests
        run: npm run test:rubi-checkout
      - name: RUBI organic campaign UTM tests
        run: npm run test:rubi-organic
      - name: RUBI Business quote calculation tests
        run: npm run test:rubi-business
      - name: RUBI Business retention tests
        run: npm run test:rubi-retention
      - name: RUBI Business follow-up tests
        run: npm run test:rubi-followup
      - name: RUBI Offer Engine playbook tests
        run: npm run test:rubi-offer
      - name: RUBI complementary offers tests
        run: npm run test:rubi-complementary
      - name: RUBI Movement Engine tests
        run: npm run test:rubi-movement
      - name: RUBI Movement variants tests
        run: npm run test:rubi-variants
      - name: RUBI movement distribution tests
        run: npm run test:rubi-distribution
      - name: RUBI movement performance tests
        run: npm run test:rubi-performance
      - name: RUBI movement publication safety tests
        run: npm run test:rubi-publication
      - name: RUBI Kairos launch readiness tests
        run: npm run test:rubi-launch
      - name: RUBI launch QA checklist tests
        run: npm run test:rubi-launch-qa
      - name: RUBI sole-Master safeguards tests
        run: npm run test:rubi-master
      - name: RUBI supplier checkout host tests
        run: npm run test:rubi-supplier-host
      - name: RUBI supplier CSV import tests
        run: npm run test:rubi-supplier-csv
      - name: RUBI launch operational gates tests
        run: npm run test:rubi-launch-gates
      - name: RUBI flagship storefront integration tests
        run: npm run test:rubi-flagship
      - name: RUBI connected commercial flow tests
        run: npm run test:rubi-connected-flow
      - name: RUBI tagged creator visit event tests
        run: npm run test:rubi-creator-tagged-visits
      - name: RUBI product story media tests
        run: npm run test:rubi-product-stories
      - name: RUBI storefront Story discovery tests
        run: npm run test:rubi-story-discovery
      - name: RUBI storefront editorial tests
        run: npm run test:rubi-editorial
      - name: RUBI editorial Story bridge tests
        run: npm run test:rubi-editorial-story
      - name: RUBI editorial metrics tests
        run: npm run test:rubi-editorial-metrics
      - name: RUBI editorial funnel tests
        run: npm run test:rubi-editorial-funnel
      - name: RUBI qualified journey tests
        run: npm run test:rubi-qualified-journey
      - name: RUBI QA commercial snapshot tests
        run: npm run test:rubi-qa-snapshot
      - name: RUBI live smoke safe validation tests
        run: npm run test:rubi-live-smoke
      - name: RUBI four audience authorization contract tests
        run: npm run test:rubi-four-profiles
      - name: RUBI browser E2E config safety tests
        run: npm run test:rubi-browser-contract
      - name: RUBI browser evidence integrity tests
        run: npm run test:rubi-browser-evidence
      - name: RUBI inventory truth tests
        run: npm run test:rubi-inventory-truth
      - name: RUBI atomic partner sale reconciliation tests
        run: node --test src/lib/rubi-partner-sale-reconciliation-atomic.test.mjs
      - name: RUBI licensed creative access and revocation regression
        run: node --test src/lib/rubi-creative-license-access.test.mjs
      - name: RUBI legacy campaign atomic audit regression
        run: node --test src/lib/rubi-legacy-campaign-atomic-audit.test.mjs
      - name: RUBI launch QA atomic audit test
        run: node --test src/lib/rubi-launch-qa-atomic-audit.test.mjs
      - name: RUBI offer-group atomic audit regression
        run: node --test src/lib/rubi-offer-group-atomic-audit.test.mjs
      - name: RUBI category lifecycle atomic audit tests
        run: node --test src/lib/rubi-category-atomic-audit.test.mjs
      - name: RUBI audience review atomic audit tests
        run: node --test src/lib/rubi-audience-review-atomic-audit.test.mjs
      - name: RUBI category highlights transactional audit regression
        run: node --test src/lib/rubi-category-highlights-atomic-audit.test.mjs
      - name: RUBI affiliate CSV secure atomic import tests
        run: node --test src/lib/rubi-affiliate-csv-atomic-audit.test.mjs
      - name: RUBI notification templates atomic audit regression
        run: node --test src/lib/rubi-notification-template-atomic-audit.test.mjs
      - name: RUBI supplier CSV transactional audit tests
        run: node --test src/lib/rubi-supplier-csv-atomic-audit.test.mjs
      - name: RUBI video and bridge-video atomic audit regression
        run: node --test src/lib/rubi-video-atomic-audit.test.mjs
      - name: RUBI video playback resolver regression
        run: node --test src/lib/rubi-video-playback.test.mjs
      - name: RUBI private video upload and signed playback regression
        run: node --test src/lib/rubi-video-storage-sprint222.test.mjs
      - name: RUBI social strategy atomic audit regression
        run: node --test src/lib/rubi-social-strategy-atomic-audit.test.mjs
      - name: RUBI Secure Hub Vault search-path hardening regression
        run: node --test src/lib/rubi-secure-hub-vault-search-path.test.mjs
      - name: RUBI partner grants server-only regression
        run: node --test src/lib/rubi-partner-grants-server-only.test.mjs
      - name: RUBI profile privilege hardening regression
        run: node --test src/lib/rubi-profile-privilege-hardening.test.mjs
      - name: RUBI profile identity and admin RPC guard regression
        run: node --test src/lib/rubi-profile-identity-guard.test.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
