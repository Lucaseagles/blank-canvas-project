name: RUBI Browser QA — Public + Guest Guards
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUBI_STOREFRONT_URL: ${{ vars.RUBI_STOREFRONT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Require published HTTPS origin
        run: |
          if [ -z "$RUBI_STOREFRONT_URL" ]; then
            echo "::error::Configure RUBI_STOREFRONT_URL in repository variables."
            exit 1
          fi
      - name: Install dependencies and Playwright runner
        run: |
          npm ci
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium
      - name: Validate source and public DNS
        run: node scripts/rubi-live-storefront-smoke.mjs
      - name: Execute browser tests (does not buy anything)
        run: |
          mkdir -p artifacts
          npx playwright test --config=rubi-playwright.config.mjs
      - name: Generate per-profile evidence matrix
        if: always()
        run: node scripts/rubi-browser-evidence.mjs
      - name: Save screenshots, traces and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubi-browser-e2e
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
