name: Sprint 33 QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # TanStack Start's Vite plugin generates the route tree during build.
      # `npx tsr` resolves an unrelated npm package and fails before QA.
      - name: Generate TanStack routes and verify initial build
        run: npm run build

      - name: Sprint 287 product status audit regression
        run: npm run test:rubi-product-status-audit

      - name: Smart collection server-only grants regression
        run: npm run test:rubi-smart-collection-server-only-grants

      - name: Sprint 308 strategy orchestration pause audit regression
        run: npm run test:rubi-orchestration-pause-audit

      - name: Sprint 307 administrative video and compliance audit regression
        run: npm run test:rubi-video-atomic-audit

      - name: Sprint 318 referral tier atomic audit regression
        run: npm run test:rubi-referral-tier-audit

      - name: Sprint 317 brand identity atomic audit regression
        run: npm run test:rubi-brand-identity-audit

      - name: Customer coupon Owner-only atomic audit regression
        run: npm run test:rubi-customer-coupons-audit

      - name: Product gallery Owner-only atomic audit regression
        run: npm run test:rubi-product-media-audit

      - name: Support FAQ Owner-only atomic audit regression
        run: npm run test:rubi-support-faq-audit

      - name: Manual retention atomic audit regression
        run: node --test src/lib/automation-manual-atomic-audit.test.mjs

      - name: Sprint 345 Telegram config and Vault atomic audit regression
        run: node --test src/lib/rubi-telegram-config-atomic-audit.test.mjs
      - name: Generic admin settings allowlist regression
        run: node --test src/lib/rubi-admin-setting-atomic-audit.test.mjs

      - name: Sprint 362 user ban Owner-only atomic audit regression
        run: npm run test:rubi-admin-user-ban-audit

      - name: Sprint 316 admin audit fail-closed regression
        run: npm run test:rubi-admin-audit-fail-closed

      - name: Admin audit POST mutation semantics regression
        run: node --test src/lib/admin-audit-post-mutation.test.mjs

      - name: Admin audit persisted result contract regression
        run: node --test src/lib/admin-audit-run-persistence.test.mjs

      - name: Sprint 319 consumer affiliate recruitment funnel regression
        run: npm run test:rubi-affiliate-recruitment-funnel

      - name: RUBI distribution campaign uniqueness regression
        run: node --test src/lib/rubi-distribution-campaign-uniqueness.test.mjs

      - name: Sprint 321 partner creator studio regression
        run: npm run test:rubi-partner-creator-studio

      - name: Sprint 322 partner customer acquisition regression
        run: npm run test:rubi-partner-customer-acquisition

      - name: Sprint 323 public creator profile regression
        run: npm run test:rubi-public-creator-profile

      - name: Sprint 324 public creator directory regression
        run: npm run test:rubi-public-creator-directory

      - name: TypeScript
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build

      # Sprint 33 final gate: generated routes + TypeScript + lint + production build must pass.
